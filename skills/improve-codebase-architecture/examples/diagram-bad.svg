<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" role="img" aria-labelledby="t d">
  <title id="t">Bad: a box that turns into another box</title>
  <desc id="d">A large container box holding three small boxes with no edges between them. One arrow points down to a second large container box holding three small boxes and a wide bar, again with no edges between them. The picture says that something changed, but not which module calls which or where the flow goes. Small boxes or chips inside a container are labels, not a diagram. Do not draw before/after diagrams this way.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#142033"/>
    </marker>
  </defs>
  <rect width="420" height="360" fill="#ffffff"/>
  <text x="16" y="28" font-family="sans-serif" font-size="18" font-weight="700" fill="#c62f2f">BAD</text>

  <!-- container 1 with three unconnected boxes -->
  <rect id="before" x="70" y="44" width="280" height="96" rx="4" fill="#ffffff" stroke="#142033" stroke-width="2"/>
  <rect x="96" y="70" width="56" height="44" fill="#ffffff" stroke="#142033" stroke-width="1.5"/>
  <rect x="182" y="70" width="56" height="44" fill="#ffffff" stroke="#142033" stroke-width="1.5"/>
  <rect x="268" y="70" width="56" height="44" fill="#ffffff" stroke="#142033" stroke-width="1.5"/>

  <!-- the only arrow: box to box -->
  <path d="M210,140 V198" fill="none" stroke="#142033" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- container 2 with three unconnected boxes and a bar -->
  <rect id="after" x="70" y="200" width="280" height="120" rx="4" fill="#ffffff" stroke="#142033" stroke-width="2"/>
  <rect x="96" y="216" width="56" height="40" fill="#ffffff" stroke="#142033" stroke-width="1.5"/>
  <rect x="182" y="216" width="56" height="40" fill="#ffffff" stroke="#142033" stroke-width="1.5"/>
  <rect x="268" y="216" width="56" height="40" fill="#ffffff" stroke="#142033" stroke-width="1.5"/>
  <rect x="110" y="272" width="200" height="30" fill="#ffffff" stroke="#142033" stroke-width="1.5"/>

  <text x="210" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6779">This box became that box. Nothing shows what flows where.</text>
</svg>
